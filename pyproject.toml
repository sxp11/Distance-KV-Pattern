[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distance-kv-pattern"
version = "0.1.0"
description = "Distance-aware static KV retention pattern learning and inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["transformers==4.45.0", "tokenizers==0.20.1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
distance_kv_pattern = [
  "inference/static_q_head/csrc/*.cu",
  "inference/static_q_head/csrc/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
